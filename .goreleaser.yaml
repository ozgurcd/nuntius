version: 2
project_name: nuntius

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/nuntius
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    # The binary uses the source-controlled nuntius.Version constant.
    ldflags:
      - -s -w

archives:
  - formats:
      - tar.gz
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - RELEASE_NOTES.md
      - PROJECT_SPEC.md
      - docs/*.md
      - assets/brand/*
      - THIRD_PARTY_NOTICES
      - src: menubar/licenses/*.txt
        dst: menubar-licenses
        strip_parent: true
      - src: release-helpers/{{ .Os }}_{{ .Arch }}/nuntius-menubar
        dst: .
        strip_parent: true
      - src: '{{ if eq .Os "darwin" }}release-helpers/{{ .Os }}_{{ .Arch }}/Nuntius Menu Bar.app/Contents/Info.plist{{ else }}no-darwin-bundle-*{{ end }}'
        dst: Nuntius Menu Bar.app/Contents
        strip_parent: true
      - src: '{{ if eq .Os "darwin" }}release-helpers/{{ .Os }}_{{ .Arch }}/Nuntius Menu Bar.app/Contents/MacOS/nuntius-menubar{{ else }}no-darwin-bundle-*{{ end }}'
        dst: Nuntius Menu Bar.app/Contents/MacOS
        strip_parent: true
      - src: '{{ if eq .Os "darwin" }}release-helpers/{{ .Os }}_{{ .Arch }}/Nuntius Menu Bar.app/Contents/Resources/Relay.icns{{ else }}no-darwin-bundle-*{{ end }}'
        dst: Nuntius Menu Bar.app/Contents/Resources
        strip_parent: true
      - src: '{{ if eq .Os "darwin" }}release-helpers/{{ .Os }}_{{ .Arch }}/Nuntius Menu Bar.app/Contents/_CodeSignature/CodeResources{{ else }}no-darwin-bundle-*{{ end }}'
        dst: Nuntius Menu Bar.app/Contents/_CodeSignature
        strip_parent: true
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

release:
  replace_existing_artifacts: false

homebrew_casks:
  - name: nuntius
    skip_upload: true
    repository:
      owner: ozgurcd
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/ozgurcd/nuntius"
    description: "Local MCP server and CLI for coordinating coding agents"
    binaries:
      - nuntius
    custom_block: |
      on_macos do
        app "Nuntius Menu Bar.app"
        binary "#{appdir}/Nuntius Menu Bar.app/Contents/MacOS/nuntius-menubar", target: "nuntius-menubar"
      end
      on_linux do
        binary "nuntius-menubar"
      end
    url:
      template: "https://github.com/ozgurcd/nuntius/releases/download/v#{version}/{{ .ArtifactName }}"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/nuntius"]
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/nuntius-menubar"]
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{appdir}/Nuntius Menu Bar.app"]
          end
